<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duck.ai Chat Interface</title>
  <style>
    :root {
      --primary: #007aff;
      --bg: #f5f5f5;
      --user-bubble: #007aff;
      --assistant-bubble: #e5e5ea;
      --text-user: #fff;
      --text-assistant: #000;
      --border-radius: 20px;
      --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background: var(--bg);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-container {
      width: 100%;
      max-width: 800px;
      height: 90vh;
      margin: 20px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 75%;
      padding: 10px 16px;
      border-radius: var(--border-radius);
      line-height: 1.4;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .message.user {
      align-self: flex-end;
      background: var(--user-bubble);
      color: var(--text-user);
      border-bottom-right-radius: 4px;
    }

    .message.assistant {
      align-self: flex-start;
      background: var(--assistant-bubble);
      color: var(--text-assistant);
      border-bottom-left-radius: 4px;
    }

    .message.error {
      background: #ffebee;
      color: #c62828;
      align-self: center;
      max-width: 90%;
    }

    #chat-form {
      display: flex;
      gap: 10px;
      padding: 15px;
      border-top: 1px solid #eee;
    }

    #user-input {
      flex: 1;
      padding: 12px 18px;
      border: 1px solid #ccc;
      border-radius: 25px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    #user-input:focus {
      border-color: var(--primary);
    }

    button {
      padding: 12px 24px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      transition: background 0.2s;
    }

    button:hover {
      background: #0056b3;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    /* Loading indicator */
    .typing-indicator {
      display: inline-block;
      padding: 10px 16px;
      background: var(--assistant-bubble);
      border-radius: var(--border-radius);
    }

    .typing-indicator span {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin: 0 2px;
      background: #999;
      border-radius: 50%;
      animation: blink 1.4s infinite both;
    }

    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0; }
      40% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div id="messages"></div>
    <form id="chat-form">
      <input type="text" id="user-input" placeholder="Type your message..." autocomplete="off" required>
      <button type="submit" id="send-btn">Send</button>
    </form>
  </div>

  <script>
    (function() {
      const messagesDiv = document.getElementById('messages');
      const form = document.getElementById('chat-form');
      const input = document.getElementById('user-input');
      const sendBtn = document.getElementById('send-btn');

      // Conversation history (sent to backend on every request)
      let conversation = [];

      // Add a message to the UI
      function addMessage(role, text) {
        const div = document.createElement('div');
        div.className = `message ${role}`;
        div.textContent = text;
        messagesDiv.appendChild(div);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        return div;
      }

      // Show a temporary typing indicator
      function showTypingIndicator() {
        const div = document.createElement('div');
        div.className = 'message assistant typing-indicator';
        div.innerHTML = '<span></span><span></span><span></span>';
        messagesDiv.appendChild(div);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        return div;
      }

      // Remove typing indicator and replace with actual message
      function replaceTypingIndicator(indicator, text) {
        indicator.remove();
        return addMessage('assistant', text);
      }

      // Disable form while streaming
      function setLoading(loading) {
        sendBtn.disabled = loading;
        input.disabled = loading;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const userText = input.value.trim();
        if (!userText) return;

        // Add user message to UI and conversation
        addMessage('user', userText);
        conversation.push({ role: 'user', content: userText });
        input.value = '';
        setLoading(true);

        // Show typing indicator
        const typingIndicator = showTypingIndicator();

        try {
          const response = await fetch('/.netlify/functions/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ messages: conversation })
          });

          if (!response.ok) {
            const errorData = await response.json().catch(() => ({ error: `HTTP ${response.status}` }));
            throw new Error(errorData.error || `Request failed with status ${response.status}`);
          }

          // Stream the response
          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let assistantReply = '';

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            const chunk = decoder.decode(value, { stream: true });
            assistantReply += chunk;
            // Update the typing indicator's text as we receive data
            if (typingIndicator.parentNode) {
              typingIndicator.textContent = assistantReply;
              typingIndicator.classList.remove('typing-indicator');
              messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }
          }

          // Final replace (in case it didn't already)
          if (typingIndicator.parentNode) {
            replaceTypingIndicator(typingIndicator, assistantReply);
          }

          // Save assistant reply to conversation
          conversation.push({ role: 'assistant', content: assistantReply });
        } catch (error) {
          console.error('Error:', error);
          // Replace typing indicator with error message
          if (typingIndicator.parentNode) {
            typingIndicator.remove();
          }
          const errorDiv = addMessage('error', `Error: ${error.message}`);
          // Remove the last user message from conversation to avoid poisoning context?
          // We'll keep it; the user can retry.
        } finally {
          setLoading(false);
          input.focus();
        }
      });

      // Clear conversation button (optional)
      window.clearChat = function() {
        conversation = [];
        messagesDiv.innerHTML = '';
      };
    })();
  </script>
</body>
</html>
