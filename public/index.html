<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duck.ai JSON Scraper</title>
<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: #161616;
    color: #fff;
    display: flex;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
}

.container {
    width: 100%;
    max-width: 800px;
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: 20px;
    box-sizing: border-box;
}

.chat-display {
    flex: 1;
    overflow-y: auto;
    padding: 20px 0;
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.message {
    padding: 12px 16px;
    border-radius: 12px;
    max-width: 80%;
    line-height: 1.5;
}

.user {
    align-self: flex-end;
    background-color: #007bff;
    color: white;
}

.ai {
    align-self: flex-start;
    background-color: #2a2a2a;
    border: 1px solid #333;
}

.input-area {
    display: flex;
    gap: 10px;
    padding-top: 10px;
    border-top: 1px solid #333;
}

input {
    flex: 1;
    padding: 12px;
    border-radius: 24px;
    border: 1px solid #444;
    background: #222;
    color: white;
    outline: none;
}

button {
    padding: 0 20px;
    border-radius: 24px;
    border: none;
    background: #007bff;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

button:disabled {
    opacity: 0.5;
}
</style>
</head>
<body>
    <div class="container">
        <div id="chat-display" class="chat-display"></div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Type a message..." autocomplete="off">
            <button id="send-btn">Send</button>
        </div>
    </div>
  <script>
    const chatDisplay = document.getElementById('chat-display');
const userInput = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');

// Memory: Load history from localStorage
let chatHistory = JSON.parse(localStorage.getItem('duckChatHistory')) || [];

// Render initial history
function renderHistory() {
    chatDisplay.innerHTML = '';
    chatHistory.forEach(msg => {
        addMessageToUI(msg.role, msg.content, false);
    });
    scrollDown();
}

function addMessageToUI(role, content, save = true) {
    const div = document.createElement('div');
    div.className = `message ${role}`;
    div.textContent = content; // For raw JSON, you might want to <pre> tag it
    chatDisplay.appendChild(div);
    
    if (save) {
        chatHistory.push({ role, content });
        localStorage.setItem('duckChatHistory', JSON.stringify(chatHistory));
    }
    scrollDown();
}

function scrollDown() {
    chatDisplay.scrollTop = chatDisplay.scrollHeight;
}

async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    userInput.value = '';
    sendBtn.disabled = true;
    
    // Add user message to UI
    addMessageToUI('user', text);

    // Create AI placeholder
    const aiMsgDiv = document.createElement('div');
    aiMsgDiv.className = 'message ai';
    aiMsgDiv.textContent = 'Thinking...';
    chatDisplay.appendChild(aiMsgDiv);
    scrollDown();

    try {
        // Prepare history for backend (limit last 10 messages to save bandwidth)
        const historyPayload = chatHistory.slice(-10); 
        
        const response = await fetch('/.netlify/functions/scrape', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                message: text, 
                history: historyPayload 
            })
        });

        const data = await response.json();

        if (data.success) {
            aiMsgDiv.textContent = data.response;
            // Add to history
            chatHistory.push({ role: 'ai', content: data.response });
            localStorage.setItem('duckChatHistory', JSON.stringify(chatHistory));
        } else {
            aiMsgDiv.textContent = `Error: ${data.error}`;
        }
    } catch (err) {
        aiMsgDiv.textContent = "Network error";
    } finally {
        sendBtn.disabled = false;
        scrollDown();
    }
}

sendBtn.addEventListener('click', sendMessage);
userInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendMessage();
});

// Init
renderHistory();
  </script>
</body>
</html>
